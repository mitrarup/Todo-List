<body>
    <header>
        <button class="todo_btn btn">
            <h1>+</h1>
            <h2>Add Task</h2>
        </button>
    </header>
    <div class="separate"></div>
    <dialog id="my_dialog">
        <div>
            <h2>Add New Task</h2>
            <button id="cancel">X</button>
        </div>
        <form id="myform">
            <div>
                <label for="title">Title:</label>
                <p><input type="text" id="title" name="title" required></p>
            </div>
            <div>
                <label for="description">Description:</label>
                <p><input type="text" id="description" name="description" required></p>
            </div>
            <div>
                <label for="duedate">Duedate:</label>
                <p><input type="date" id="duedate" name="duedate" required></p>
            </div>
            <div id="select">
                <label for="priority">Priority:</label>
                <select name="priority" id="priority">
                <option value="high">High</option>
                <option value="medium">Medium</option>
                <option value="low">Low</option>
                </select>
            </div>
            <div>
                <button type="submit" id="submit_form">Add Todo</button>
            </div>
        </form>
    </dialog>
    <dialog id="my_edit_dialog">
        <div>
            <h2>Add New Task</h2>
            <button id="edit_cancel">X</button>
        </div>
        <form id="myedit_form">
            <div>
                <label for="edit_title">Title:</label>
                <p><input type="text" id="edit_title" name="edit_title" required></p>
            </div>
            <div>
                <label for="edit_description">Description:</label>
                <p><input type="text" id="edit_description" name="edit_description" required></p>
            </div>
            <div>
                <label for="edit_duedate">Duedate:</label>
                <p><input type="date" id="edit_duedate" name="edit_duedate" required></p>
            </div>
            <div id="select">
                <label for="priority">Priority:</label>
                <select name="edit_priority" id="edit_priority">
                <option value="high">High</option>
                <option value="medium">Medium</option>
                <option value="low">Low</option>
                </select>
            </div>
            <div>
                <button type="submit" id="submit_edit_form">Add Todo</button>
            </div>
        </form>
    </dialog>
